# 구독 갱신 — 고객 안내 발송 + 오늘 챙길 고객 알림
#
# 매일 아침 9시(KST)에 두 가지를 순서대로 한다.
#   1) 단계가 올라간 고객에게 갱신 안내 메일 (renewal_notice.py)
#   2) 오늘 챙길 고객을 우선순위대로 관리자에게 (renewal_alert.py)
# 순서가 중요하다 — 안내를 먼저 보내야 관리자 알림에 "방금 보냄"이 반영된다.
#
# ★★ 고객 메일은 기본으로 나가지 않는다.
#   저장소 Variables 에 SEND_CUSTOMER_MAIL=true 를 넣어야 실제로 발송한다.
#   그전까지는 "이런 메일이 나갈 예정" 미리보기만 관리자에게 온다.
#   고객에게 잘못 나간 메일은 되돌릴 수 없으므로 확인 단계를 일부러 두었다.
#
# 챙길 고객이 없는 날 관리자 알림은 보내지 않는다 — 매일 오는 빈 메일은 곧 안 보게 된다.
#
# ★ 아침에 보내는 이유: 다운로드 요약(daily-report)은 하루를 정리하는 밤 9시가 맞지만,
#   갱신은 "오늘 전화할 곳" 목록이라 업무 시작 전에 와야 쓸모가 있다.
#
# 준비: 저장소 Settings → Secrets and variables → Actions
#   SUPABASE_URL · SUPABASE_SERVICE_KEY · MAIL_USERNAME · MAIL_APP_PASSWORD · MAIL_TO
#   — 전부 daily-report 워크플로가 이미 쓰는 값이라 새로 등록할 것이 없다.
#
# 선행 조건: docs/supabase-renewals.sql 을 Supabase SQL Editor 에서 한 번 실행해
#   renewal_watch 뷰가 있어야 한다. 없으면 첫 실행이 404 로 실패한다.

name: 구독 갱신 안내·알림

on:
  schedule:
    - cron: '0 0 * * *'      # 매일 09:00 KST (UTC 00:00)
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      send_when_empty:
        description: '챙길 고객이 없어도 메일 보내기'
        type: boolean
        default: true

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 상한(MAX_SEND)을 넘으면 아무것도 보내지 않고 실패한다.
      # 날짜를 잘못 넣어 전원이 만료 대상이 되는 사고를 막는 장치다.
      - name: 고객에게 갱신 안내 보내기
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAIL_USERNAME:        ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD:    ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO:              ${{ secrets.MAIL_TO }}
          REPLY_TO:             ${{ secrets.REPLY_TO }}
          # ★ Variables 에 SEND_CUSTOMER_MAIL=true 를 넣기 전에는 미리보기만 한다
          SEND_CUSTOMER_MAIL:   ${{ vars.SEND_CUSTOMER_MAIL }}
          MAX_SEND:             ${{ vars.MAX_SEND }}
        run: python .github/scripts/renewal_notice.py

      - name: 갱신 대상 알림 보내기
        # 안내 발송이 실패해도 "오늘 챙길 고객" 목록은 받아야 한다
        if: always()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAIL_USERNAME:        ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD:    ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO:              ${{ secrets.MAIL_TO }}
          # 수동 실행이면 입력값을, 예약 실행이면 false(챙길 고객이 있는 날만 발송)
          SEND_WHEN_EMPTY:      ${{ github.event_name == 'workflow_dispatch' && inputs.send_when_empty || 'false' }}
        run: python .github/scripts/renewal_alert.py
